name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # Some transitive dependencies carry low OpenSSF scores without known
          # CVEs. Rely on fail-on-severity for vulnerabilities.
          warn-on-openssf-scorecard-level: 0
